<!-- CÓDIGO LEGADO: Estrutura sem semântica, sem acessibilidade e sem envio de arquivo -->
<div class="box-suporte">
    <div class="titulo">Abrir Chamado Técnico</div>
    
    <div class="campo">
        <span>Nome Completo:</span>
        <input type="text" name="nome">
    </div>

    <div class="campo">
        <span>E-mail de Contato:</span>
        <input type="text" name="email">
    </div>

    <div class="campo">
        <span>Prioridade:</span>
        <select name="prioridade">
            <option>Baixa</option>
            <option>Média</option>
            <option>Alta</option>
        </select>
    </div>

    <div class="campo">
        <span>Arquivo de Log ou Print (PNG/PDF):</span>
        <input type="file" name="anexo">
    </div>

    <div class="botao" onclick="alert('Enviado')">Enviar Chamado</div>
</div>
